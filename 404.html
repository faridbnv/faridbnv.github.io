<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found — Farid Benvidi</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      main { min-height: 100svh; display: grid; place-items: center; padding: 40px 0; }
      .not-found { max-width: 760px; }
      .not-found h1 { margin-bottom: 24px; }
      .not-found p { max-width: 560px; color: var(--ink-soft); font-size: 18px; }
      .not-found .button { margin-top: 18px; width: max-content; }
    </style>
  </head>
  <body>
    <main>
      <div class="shell not-found">
        <p class="eyebrow">404 / Page not found</p>
        <h1>This route is outside the model.</h1>
        <p>The page may have moved, or it may be part of a case study that has not been published yet.</p>
        <a class="button button-primary" href="/">Return home <span aria-hidden="true">↗</span></a>
      </div>
    </main>
  </body>
</html>
